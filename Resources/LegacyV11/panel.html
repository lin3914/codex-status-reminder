<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="pet-panel.css">
  <title>Codex 任务进展</title>
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      const root = document.getElementById("root");
      const MAX_VISIBLE_TASK_ROWS = 3;
      let taskScrollTop = 0;
      let view = null;
      let lastLayoutKey = null;
      let lastTaskCount = 0;
      let visible = false;
      let frameRequest = null;
      let presentationID = 0;
      const taskRows = new Map();
      const diagnostics = { builds: 0, updates: 0, measurements: 0, firstFrameAt: null };
      window.panelRendererDiagnostics = () => ({ ...diagnostics, presentationID });

      const send = (payload) => {
        window.webkit?.messageHandlers?.panel?.postMessage(payload);
      };
      const createElement = (tagName, className, text) => {
        const element = document.createElement(tagName);
        if (className) element.className = className;
        if (text !== undefined && text !== null) element.textContent = String(text);
        return element;
      };
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const setText = (element, text) => {
        const next = String(text ?? "");
        if (element.textContent !== next) element.textContent = next;
      };

      const buildInfoCard = (label, value, className, options = {}) => {
        const { compact = false, badge, badgeDescription } = options;
        const card = createElement("div", `status-info-card ${className}`);
        const heading = createElement("div", "status-info-heading");
        heading.append(createElement("span", "status-info-label", label));
        if (badge) {
          const healthBadge = createElement("span", "status-health-badge", badge);
          if (badgeDescription) healthBadge.title = badgeDescription;
          heading.append(healthBadge);
        }
        card.append(
          heading,
          createElement("strong", `status-info-value${compact ? " is-compact" : ""}`, value)
        );
        return card;
      };

      const buildTaskMetric = (value, label, className, accessibleLabel) => {
        const metric = createElement("span", `status-task-metric ${className}${value === 0 ? " is-zero" : ""}`);
        metric.setAttribute("aria-label", `${value} 个${accessibleLabel}`);
        metric.append(
          createElement("strong", "status-task-metric-value", value > 99 ? "99+" : value),
          createElement("span", "status-task-metric-label", label)
        );
        return metric;
      };

      const buildTaskRow = (task) => {
        const row = createElement("button", "status-task-row");
        row.dataset.taskId = task.id;
        row.type = "button";
        row.setAttribute("aria-label", `${task.stateLabel}：${task.title}。${task.progress}`);
        row.addEventListener("click", (event) => {
          event.stopPropagation();
          send({ type: "openTask", id: task.id });
        });
        const headline = createElement("div", "status-task-headline");
        headline.append(
          createElement("div", "status-task-title", task.title),
          createElement("span", `status-task-phase is-${task.stateClass}`, task.stateLabel)
        );
        const update = createElement("div", "status-task-update");
        update.append(createElement("span", "status-task-update-text", task.progress));
        row.append(headline, update);
        return row;
      };

      const updateTaskScrollState = (list) => {
        const scroll = list?.parentElement;
        if (!scroll) return;
        const maxScrollTop = Math.max(0, list.scrollHeight - list.clientHeight);
        const trackHeight = list.clientHeight;
        const thumbHeight = maxScrollTop > 1
          ? clamp(trackHeight * trackHeight / list.scrollHeight, 22, trackHeight)
          : trackHeight;
        const thumbOffset = maxScrollTop > 1
          ? list.scrollTop / maxScrollTop * Math.max(0, trackHeight - thumbHeight)
          : 0;
        scroll.classList.toggle("is-scrollable", maxScrollTop > 1);
        scroll.classList.toggle("is-at-top", list.scrollTop <= 1);
        scroll.classList.toggle("is-at-bottom", list.scrollTop >= maxScrollTop - 1);
        scroll.style.setProperty("--scroll-thumb-height", `${thumbHeight}px`);
        scroll.style.setProperty("--scroll-thumb-offset", `${thumbOffset}px`);
      };

      window.applyPanelPosition = (position) => {
        const frame = view?.frame;
        if (!frame || !position) return;
        frame.classList.toggle("is-up", position.direction === "up");
        frame.classList.toggle("is-down", position.direction !== "up");
        if (Number.isFinite(Number(position.arrowX))) {
          frame.style.setProperty("--popover-arrow-x", `${Number(position.arrowX)}px`);
        }
      };

      window.renderTaskPanel = (state) => {
        const copy = state.copy || {
          quotaRemaining: "额度剩余",
          timeRemaining: "时间剩余",
          resetCountdown: "重置倒计时",
          taskProgress: "任务进展",
          unread: "待查看",
          running: "进行中",
          completed: "已处理"
        };
        document.documentElement.lang = state.locale || "zh-CN";
        document.title = copy.taskProgress;
        if (!view) {
          const frame = createElement("div", "status-popover-frame is-down");
          frame.append(createElement("div", "status-popover-arrow"));
          const content = createElement("div", "status-popover-content");
          const grid = createElement("div", "status-info-grid");
          const cards = [
            buildInfoCard(copy.quotaRemaining, state.quotaValue, "is-quota", {
              badge: state.healthLabel || " ",
              badgeDescription: state.healthDescription
            }),
            buildInfoCard(copy.timeRemaining, state.timeValue, "is-time"),
            buildInfoCard(copy.resetCountdown, state.resetValue, "is-reset")
          ];
          grid.append(...cards);
          content.append(grid);
          const section = createElement("div", "status-task-section");
          const header = createElement("div", "status-popover-header");
          const titleWrap = createElement("div", "status-popover-title-wrap");
          titleWrap.append(
            createElement("span", "status-section-dot"),
            createElement("div", "status-popover-title", copy.taskProgress)
          );
          const summary = createElement("div", "status-task-summary");
          summary.setAttribute(
            "aria-label",
            `${state.unreadCount} ${copy.unread}，${state.runningCount} ${copy.running}`
          );
          summary.append(
            buildTaskMetric(state.unreadCount, copy.unread, "is-unread", copy.unread),
            buildTaskMetric(state.runningCount, copy.running, "is-running", copy.running)
          );
          header.append(titleWrap, summary);
          section.append(header);
          const scroll = createElement("div", "status-task-scroll");
          const list = createElement("div", "status-task-list");
          const scrollbar = createElement("span", "status-task-scrollbar");
          scrollbar.setAttribute("aria-hidden", "true");
          scrollbar.append(createElement("span", "status-task-scrollbar-thumb"));
          list.addEventListener("scroll", () => {
            taskScrollTop = list.scrollTop;
            updateTaskScrollState(list);
          }, { passive: true });
          scroll.append(list, scrollbar);
          frame.append(content);
          root.append(frame);
          view = {
            frame, content, cards, section, summary, scroll, list,
            title: titleWrap.querySelector(".status-popover-title"),
            metrics: [...summary.children]
          };
          diagnostics.builds += 1;
          window.applyPanelPosition(state);
        }
        const { frame, content, cards, section, summary, scroll, list, metrics } = view;
        if (list.parentElement) taskScrollTop = list.scrollTop;
        const hasSection = state.tasks.length > 0 || state.runningCount > 0 || state.unreadCount > 0;
        content.className = `status-popover-content is-${state.health || "neutral"}`;
        const labels = [copy.quotaRemaining, copy.timeRemaining, copy.resetCountdown];
        const values = [state.quotaValue, state.timeValue, state.resetValue];
        cards.forEach((card, index) => {
          setText(card.querySelector(".status-info-label"), labels[index]);
          const value = card.querySelector(".status-info-value");
          setText(value, values[index]);
          value.classList.toggle("is-compact", index === 2 && String(state.resetValue).length > 6);
        });
        const badge = cards[0].querySelector(".status-health-badge");
        setText(badge, state.healthLabel);
        badge.title = state.healthDescription || "";
        badge.hidden = !state.healthLabel;
        setText(view.title, copy.taskProgress);
        summary.setAttribute("aria-label", `${state.unreadCount} ${copy.unread}，${state.runningCount} ${copy.running}`);
        [state.unreadCount, state.runningCount].forEach((count, index) => {
          const label = index === 0 ? copy.unread : copy.running;
          const metric = metrics[index];
          metric.classList.toggle("is-zero", count === 0);
          metric.setAttribute("aria-label", `${count} ${label}`);
          setText(metric.querySelector(".status-task-metric-value"), count > 99 ? "99+" : count);
          setText(metric.querySelector(".status-task-metric-label"), label);
        });
        if (hasSection && !section.parentElement) content.append(section);
        else if (!hasSection) section.remove();
        if (state.tasks.length > 0 && !scroll.parentElement) section.append(scroll);
        else if (state.tasks.length === 0) scroll.remove();
        const ids = new Set(state.tasks.map((task) => task.id));
        for (const [id, row] of taskRows) {
          if (!ids.has(id)) { row.remove(); taskRows.delete(id); }
        }
        state.tasks.forEach((task, index) => {
          let row = taskRows.get(task.id);
          if (!row) { row = buildTaskRow(task); taskRows.set(task.id, row); }
          setText(row.querySelector(".status-task-title"), task.title);
          setText(row.querySelector(".status-task-update-text"), task.progress);
          const phase = row.querySelector(".status-task-phase");
          phase.className = `status-task-phase is-${task.stateClass}`;
          setText(phase, task.stateLabel);
          row.setAttribute("aria-label", `${task.stateLabel}：${task.title}。${task.progress}`);
          if (list.children[index] !== row) list.insertBefore(row, list.children[index] || null);
        });
        const rows = Math.min(state.tasks.length, MAX_VISIBLE_TASK_ROWS);
        const layoutKey = JSON.stringify([state.locale, hasSection, rows]);
        const layoutChanged = layoutKey !== lastLayoutKey;
        if (layoutChanged) {
          list.style.setProperty("--task-list-height", `${rows * 82 + Math.max(0, rows - 1) * 6}px`);
        }
        root.dataset.renderRevision = String(state.renderRevision);
        diagnostics.updates += 1;
        if (state.tasks.length > 0 && (layoutChanged || lastTaskCount !== state.tasks.length)) {
          const maxScrollTop = Math.max(0, list.scrollHeight - list.clientHeight);
          list.scrollTop = Math.min(taskScrollTop, maxScrollTop);
          updateTaskScrollState(list);
        } else if (state.tasks.length === 0) {
          taskScrollTop = 0;
        }
        lastTaskCount = state.tasks.length;
        lastLayoutKey = layoutKey;
        if (layoutChanged) {
          diagnostics.measurements += 1;
          // Synchronous layout only for structural changes, never a hidden
          // animation frame or a repeated-open size round trip.
          send({
            type: "resize",
            height: Math.ceil(frame.getBoundingClientRect().height),
            renderRevision: state.renderRevision
          });
        } else {
          send({ type: "rendered", renderRevision: state.renderRevision });
        }
      };

      root.addEventListener("mouseenter", () => send({ type: "enter" }));
      root.addEventListener("mouseleave", () => send({ type: "leave" }));
      window.companion?.onSnapshot?.((state) => {
        window.renderTaskPanel(state);
      });
      window.companion?.onPosition?.((position) => {
        window.applyPanelPosition(position);
      });
      window.companion?.onPresent?.((request) => {
        if (!view || Number(root.dataset.renderRevision) !== request.renderRevision) return;
        window.applyPanelPosition(request);
        presentationID = request.presentationID;
        view.frame.classList.add("is-presenting");
        send({
          type: "presented",
          presentationID,
          renderRevision: request.renderRevision
        });
      });
      window.companion?.onVisibility?.((state) => {
        visible = Boolean(state.visible);
        if (frameRequest !== null) {
          cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
        if (!visible) {
          view?.frame.classList.remove("is-presenting");
          return;
        }
        // Observe a visible renderer frame AFTER the native window is shown.
        // This one-shot callback never gates hidden preparation or opening.
        diagnostics.firstFrameAt = null;
        frameRequest = requestAnimationFrame(() => {
          frameRequest = null;
          if (!visible || state.presentationID !== presentationID) return;
          diagnostics.firstFrameAt = Date.now();
          send({
            type: "frame",
            presentationID,
            renderRevision: Number(root.dataset.renderRevision),
            latencyMs: diagnostics.firstFrameAt - state.requestedAt
          });
        });
      });
      send({ type: "ready" });
    })();
  </script>
</body>
</html>
