<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="notification.css">
  <title>CodeX状态提醒</title>
</head>
<body>
  <main id="notification-stack" class="completion-notification-stack"></main>
  <script>
    (() => {
      const stack = document.getElementById("notification-stack");

      function copyFor(locale) {
        return locale === "en"
          ? {
              pending: "pending",
              more: (count) => `+${count}`,
              expand: (count) => `Show ${count} more notifications`,
              collapse: "Collapse notifications"
            }
          : {
              pending: "待查看",
              more: (count) => `+${count}`,
              expand: (count) => `展开另外 ${count} 条完成提醒`,
              collapse: "收起通知"
            };
      }

      function createCloseButton(item) {
        const close = document.createElement("button");
        close.className = "completion-notification-close";
        close.type = "button";
        const closeLabel = item.closeLabel || "关闭通知";
        close.setAttribute("aria-label", closeLabel);
        close.title = closeLabel;
        const closeGlyph = document.createElement("span");
        closeGlyph.className = "completion-notification-close-glyph";
        closeGlyph.setAttribute("aria-hidden", "true");
        close.append(closeGlyph);
        close.addEventListener("click", (event) => {
          // Closing this reminder is intentionally separate from opening the
          // Codex task, so the session's read state remains source-of-truth.
          event.stopPropagation();
          window.companionNotification.close(item.threadID);
        });
        close.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            window.companionNotification.close(item.threadID);
          }
        });
        return close;
      }

      function bindOpen(notification, item) {
        notification.addEventListener("click", () => {
          window.companionNotification.open(item.threadID);
        });
        notification.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            window.companionNotification.open(item.threadID);
          }
        });
      }

      function createFrontCard(item, moreCount, copy) {
        const notification = document.createElement("article");
        notification.className = "completion-notification";
        notification.role = "button";
        notification.tabIndex = 0;
        notification.dataset.threadId = item.threadID;

        const titlebar = document.createElement("header");
        titlebar.className = "completion-notification-titlebar";
        const icon = document.createElement("img");
        icon.className = "completion-notification-icon";
        icon.src = "app-icon.png";
        icon.alt = "";
        const title = document.createElement("strong");
        title.className = "completion-notification-title";
        title.textContent = item.title || item.appName || "CodeX状态提醒";
        titlebar.append(icon, title);

        if (moreCount > 0) {
          const more = document.createElement("button");
          more.className = "completion-notification-more";
          more.type = "button";
          more.textContent = copy.more(moreCount);
          more.setAttribute("aria-label", copy.expand(moreCount));
          more.title = copy.expand(moreCount);
          more.addEventListener("click", (event) => {
            event.stopPropagation();
            window.companionNotification.toggleExpanded();
          });
          more.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              event.stopPropagation();
              window.companionNotification.toggleExpanded();
            }
          });
          titlebar.append(more);
        }

        titlebar.append(createCloseButton(item));
        const body = document.createElement("p");
        body.className = "completion-notification-body";
        body.textContent = item.body || "";
        notification.append(titlebar, body);
        bindOpen(notification, item);
        return notification;
      }

      function createCollapsedGroup(items, content, copy) {
        const layers = Math.min(
          Math.max(0, Number(content.collapsedLayers) || 0),
          Math.max(0, items.length - 1)
        );
        const group = document.createElement("section");
        group.className = "completion-notification-group";
        group.style.setProperty(
          "--stack-depth",
          `${layers * 12}px`
        );
        for (let layer = layers; layer >= 1; layer -= 1) {
          const rear = document.createElement("div");
          rear.className = "completion-notification-stack-layer";
          rear.setAttribute("aria-hidden", "true");
          rear.style.setProperty("--layer-y", `${layer * 12}px`);
          rear.style.setProperty(
            "--layer-opacity",
            String(0.34 + (layers - layer) * 0.12)
          );
          group.append(rear);
        }
        group.append(createFrontCard(items[0], items.length - 1, copy));
        return group;
      }

      function createExpandedRow(item) {
        const row = document.createElement("article");
        row.className = "completion-notification-row";
        row.role = "button";
        row.tabIndex = 0;
        row.dataset.threadId = item.threadID;
        const titlebar = document.createElement("header");
        titlebar.className = "completion-notification-row-titlebar";
        const title = document.createElement("strong");
        title.className = "completion-notification-row-title";
        title.textContent = item.title || item.appName || "CodeX状态提醒";
        titlebar.append(title, createCloseButton(item));
        const body = document.createElement("p");
        body.className = "completion-notification-row-body";
        body.textContent = item.body || "";
        row.append(titlebar, body);
        bindOpen(row, item);
        return row;
      }

      function createExpandedGroup(items, content, copy) {
        const panel = document.createElement("section");
        panel.className = "completion-notification-expanded";
        panel.style.height = `${Math.max(0, Number(content.expandedContentHeight) || 0)}px`;

        const header = document.createElement("header");
        header.className = "completion-notification-expanded-header";
        const icon = document.createElement("img");
        icon.className = "completion-notification-icon";
        icon.src = "app-icon.png";
        icon.alt = "";
        const title = document.createElement("strong");
        title.className = "completion-notification-expanded-title";
        title.textContent = `${items.length} ${copy.pending}`;
        const collapse = document.createElement("button");
        collapse.className = "completion-notification-collapse";
        collapse.type = "button";
        collapse.textContent = copy.collapse;
        collapse.setAttribute("aria-label", copy.collapse);
        collapse.addEventListener("click", () => {
          window.companionNotification.toggleExpanded();
        });
        header.append(icon, title, collapse);

        const list = document.createElement("div");
        list.className = "completion-notification-list";
        list.setAttribute("role", "list");
        list.append(...items.map(createExpandedRow));
        panel.append(header, list);
        return panel;
      }

      window.companionNotification.onContent((content) => {
        const items = Array.isArray(content?.items) ? content.items : [];
        const copy = copyFor(content?.locale);
        if (items.length === 0) {
          stack.replaceChildren();
        } else if (content?.expanded && items.length > 1) {
          stack.replaceChildren(createExpandedGroup(items, content, copy));
        } else {
          stack.replaceChildren(createCollapsedGroup(items, content, copy));
        }
        document.title = items[0]?.title || items[0]?.appName || "CodeX状态提醒";
      });
      window.companionNotification.ready();
    })();
  </script>
</body>
</html>
