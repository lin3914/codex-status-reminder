name: macOS tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Ensure source-check dependency
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Public source and fixture tests (no Codex account required)
        run: |
          npm run audit:public
          npm test
      - name: Dependency audit
        run: npm run audit:dependencies
      - name: Build with the bundled runtime only
        run: npm run build
      - name: Check application metadata, helpers, resources and local signature
        run: npm run check:release
      - name: Packaged UI and real IPC smoke using synthetic data only
        run: npm run test:renderer
      - name: Completion event to persistent banner delivery (isolated synthetic tasks)
        run: npm run test:notifications
